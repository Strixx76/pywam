[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pywam"
version = "0.2.2"
description = "Library built on AsyncIO for communicating with Samsung Wireless Audio speakers (WAM)."
license = { text = "MIT License" }
readme = "README.md"
authors = [{ name = "Daniel Jönsson" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

[project.urls]
"Homepage" = "https://www.github.com/Strixx76/pywam"

[tool.hatch.build.targets.wheel]
packages = ["src/pywam"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/README.md", "/CHANGELOG.md", "/LICENSE.txt", "/src/pywam"]
